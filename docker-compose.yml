version: "3.9"


services:

  backend:

    image: ${DOCKERHUB_USER}/formapp-backend:${IMAGE_TAG}

    container_name: formapp-backend

    restart: unless-stopped

    environment:

      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-prod}

      DJANGO_DEBUG: "False"

      DJANGO_ALLOWED_HOSTS: "*"

      CORS_ALLOW_ALL_ORIGINS: "True"


    volumes:

      - backend_data:/app/data


    expose:

      - "8000"


    networks:

      - appnet



  nginx:

    image: ${DOCKERHUB_USER}/formapp-nginx:${IMAGE_TAG}


    container_name: formapp-nginx


    restart: unless-stopped


    depends_on:

      - backend


    ports:

      - "80:80"


    networks:

      - appnet




networks:

  appnet:

    driver: bridge



volumes:

  backend_data: